<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Witching & Wonder</title>
    <meta
      name="description"
      content="Whimsical, enchanted cottage-core landing page inspired by moonlit folklore and occult charm."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Homemade+Apple&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
  </head>
  <body>
    <div class="page-shell">
      <main class="hero">
        <section class="content">
          <p class="eyebrow">Witching & Wonder</p>
          <h1>Welcome to the Midterm App</h1>
          <p class="lede">
            Hexes, herbs, and midnight magic for the autumn soul. Browse the haunted little
            treasures of the Hollow and find your next favorite spell.
          </p>
          <a href="/browse" class="browse-link">Explore Witching & Wonder</a>
        </section>

        <section class="art-panel" aria-label="Mystical decorative illustration">
          <img
            src="/images/halloween-icons.png"
            alt="A mystical witchy illustration with moonlit symbols and occult objects"
            class="mystic-art"
          />
        </section>
      </main>
    </div>
  </body>
</html>
